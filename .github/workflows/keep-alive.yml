# Visit the live dashboard every 6 hours so Streamlit Community Cloud never
# puts it to sleep (it sleeps after about 12 hours with no visitors).
name: Keep app awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    # Pinned: Playwright installs browser libraries per Ubuntu release, and
    # ubuntu-latest moved to a release it does not support yet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium

      - name: Visit the app
        run: python scripts/keep_alive.py

# Cockpit-display theme, modeled on an aircraft engine-indication display (EICAS).
# Colors carry cockpit meaning; src/dashboard/palette.py holds the same values.

[theme]
base = "dark"
primaryColor = "#3FD0FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0D0F11"
codeBackgroundColor = "#0D0F11"
textColor = "#F2F2F2"
linkColor = "#3FD0FF"
borderColor = "#2A2E33"
codeTextColor = "#F2F2F2"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Atkinson Hyperlegible':https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
headingFont = "'B612':https://fonts.googleapis.com/css2?family=B612:wght@400;700&display=swap"
codeFont = "'B612 Mono':https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["44px", "28px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 700, 700, 400, 400]
metricValueFontSize = "30px"
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "1.5rem"
paddingBottom = "3rem"

# Cockpit status colors: green normal, amber caution, red warning
greenColor = "#3DDC84"
orangeColor = "#FFB000"
redColor = "#FF4040"
yellowColor = "#FFB000"
blueColor = "#3FD0FF"
violetColor = "#FF4FD8"
grayColor = "#9AA0A6"

# Magenta marks computed values (predictions), white measured ones (true RUL)
chartCategoricalColors = [
    "#FF4FD8",
    "#F2F2F2",
    "#3DDC84",
    "#FFB000",
    "#FF4040",
    "#3FD0FF",
]
dataframeBorderColor = "#2A2E33"
dataframeHeaderBackgroundColor = "#0D0F11"
dataframeHeaderTextColor = "#F2F2F2"

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#0D0F11"
borderColor = "#2A2E33"
